[project]
name = "design-patterns-cheatsheet"
version = "2.0.0"
description = "A cheatsheet of common design patterns, implemented in plain Python."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nicolas Huber", email = "nicolas.huber.dev@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N"]
